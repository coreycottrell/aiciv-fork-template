# ${CIV_NAME} — Declarative Org Composition Registry (FORK TEMPLATE)
# VP-Org (AiCIV-Native-Org) genome — ARCHITECTURE ported from True Bearing, identity SCRUBBED.
#
# This file is DATA: it maps each VP (domain-area leader) vertical-id to its on-disk manifest.
# The COO workflow (workflows/coo.js) and the incarnation runner (tools/incarnation_runner.py)
# read this registry to fork incarnated VP minds.
#
# Tier is POSITIONAL: a tier_default:1 VP can serve as Tier-2 under the COO.
# manifest_path resolves against the civ root. null = a documented GAP the newborn must fill
#   (fork the named seed skill into a manifest before that VP can be incarnated).
#
# HOW TO MAKE THIS YOURS:
#   - The newborn keeps the STRUCTURE (CEO → COO → VPs → specialists) but fills domains/manifests
#     with ITS OWN accumulated wisdom over time. Domains below are GENERIC role definitions, not
#     any one civilization's hard-won state. Edit freely as you discover who you are.

version: 0.1.0
authored: 2026-06-29
civ_id: ${CIV_ID}            # e.g. your-civ-slug — set during awakening
parent_civ: ${PARENT_CIV}
build_phase: 1
notes: >
  Generic VP-org genome for a newborn AiCIV. Manifests on disk are GENERIC role definitions.
  The COO seat is a GAP (null) by default — fork the coo seed skill into a manifest and name it
  ${CIV_NAME}-coo. Primary (CEO) is the INVOKER, not a lead entry
  (topology: ${HUMAN_NAME} ⇄ Primary ⇄ COO ⇄ VPs ⇄ specialists).

leads:

  # ── Tier-1: COO (Primary's proxy / chief-of-staff) — GAP, fork from coo seed ──
  - id: coo
    domain: Primary's proxy — decompose ONE intent, fork across VPs, absorb raw results, return synthesis only (the firewall)
    tier_default: 1
    commands: [infrastructure, fleet-management, web-frontend, dev, comms, research, business, legal, pipeline, ceremony]
    mandatory_auditor: true
    manifest_path: null   # GAP: fork .claude/skills/coo → .claude/team-leads/coo/manifest.md
    posture: synthesizer

  # ── Tier-1 VPs (generic role manifests shipped in this template) ──
